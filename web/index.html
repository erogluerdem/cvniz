  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <title>CVniz - AI Destekli Profesyonel CV Oluşturucu | Türkiye'nin #1 CV Platformu</title>
  
  <!-- Preload critical assets -->
  <style>
    /* Critical CSS for faster initial paint */
    :root {
      --bg-main: #030712;
      color-scheme: dark;
    }
    html {
      background-color: var(--bg-main);
    }
    body {
      margin: 0;
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      min-height: 100vh;
    }
    /* Premium Loading Screen */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      z-index: 9999;
    }
    .loader-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 120px;
      height: 120px;
    }
    .loader-outer-ring {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #00d4ff;
      border-bottom-color: #7c3aed;
      animation: rotate-clockwise 2s linear infinite;
    }
    .loader-inner-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-left-color: #fbbf24;
      border-right-color: #ec4899;
      animation: rotate-counter-clockwise 1.5s linear infinite;
    }
    .loader-core {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #090d16;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: pulse-core 2s ease-in-out infinite;
    }
    .loader-core svg {
      width: 24px;
      height: 24px;
    }
    .loading-text {
      margin-top: 24px;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(to right, #ffffff, #64748b, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: text-pulse 2.5s ease-in-out infinite;
    }
    @keyframes rotate-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotate-counter-clockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulse-core {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
      50% { transform: scale(1.08); box-shadow: 0 0 35px rgba(124, 58, 237, 0.6); }
    }
    @keyframes text-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Loading state while JS loads -->
    <div class="loading-screen">
      <div class="loader-container">
        <div class="loader-outer-ring"></div>
        <div class="loader-inner-ring"></div>
        <div class="loader-core">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L14.8 8.6L22 10L16.8 14.8L18.2 22L12 18.2L5.8 22L7.2 14.8L2 10L9.2 8.6L12 2Z" fill="url(#star-grad)" />
            <defs>
              <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d4ff" />
                <stop offset="100%" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>
      <div class="loading-text">CVniz Yükleniyor</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
