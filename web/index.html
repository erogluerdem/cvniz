<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="AI destekli profesyonel CV ve özgeçmiş oluşturucu. Premium şablonlar ile dakikalar içinde etkileyici CV'nizi hazırlayın." />
  <meta name="keywords" content="CV, özgeçmiş, resume, AI, yapay zeka, profesyonel CV, iş başvurusu" />
  <meta name="theme-color" content="#030712" />
  <meta name="color-scheme" content="dark" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <title>CVniz - AI Destekli Profesyonel CV Oluşturucu | Türkiye'nin #1 CV Platformu</title>
  
  <!-- Preload critical assets -->
  <style>
    /* Critical CSS for faster initial paint */
    :root {
      --bg-main: #030712;
      color-scheme: dark;
    }
    html {
      background-color: var(--bg-main);
    }
    body {
      margin: 0;
      background-color: var(--bg-main);
      color: #f8fafc;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root {
      min-height: 100vh;
    }
    /* Premium Loading State */
    .loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #030712 100%);
      z-index: 9999;
    }
    .loading-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 100%);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 60px rgba(124, 58, 237, 0.6); transform: scale(1.05); }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Loading state while JS loads -->
    <div class="loading-screen">
      <div class="loading-logo"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
